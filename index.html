  const frame = document.getElementById('appFrame');
  const KEY = 'tabletAccounting_lastActiveMode_v1';
  function readMode(){
    try {
      const saved = localStorage.getItem(KEY);
      if (saved === 'parse' || saved === 'tablet') return saved;
    } catch(e) {}
    return 'parse';
  }
  let activeMode = readMode();
  function decodePage(b64){
    const bytes = Uint8Array.from(atob(b64), ch => ch.charCodeAt(0));
    return new TextDecoder('utf-8').decode(bytes);
  }
  function saveMode(){
    try { localStorage.setItem(KEY, activeMode); } catch(e) {}
    try { sessionStorage.setItem(KEY, activeMode); } catch(e) {}
  }
  function showMode(mode){
    if (mode !== 'parse' && mode !== 'tablet') return;
    activeMode = mode;
    saveMode();
    frame.srcdoc = decodePage(pages[mode]);
    document.title = mode === 'tablet' ? '平板电脑做账系统' : '简易解析工具';
  }
  window.addEventListener('message', event => {
    if (!event.data || event.data.type !== 'switch-mode') return;
    showMode(event.data.mode);
  });
  window.addEventListener('pagehide', saveMode);
  window.addEventListener('beforeunload', saveMode);
  showMode(activeMode);
})();
</script>
